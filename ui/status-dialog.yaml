obj:
  id: ${prefix}_dialog
  hidden: true
  width: 100%
  height: 100%
  bg_color: 0x10091D
  bg_opa: 70%
  border_width: 0
  pad_all: 0
  clickable: true
  scrollable: false
  widgets:
    - obj:
        align: CENTER
        width: 416
        height: 172
        styles: [panel_style, card_corners]
        pad_all: 14
        scrollable: false
        widgets:
          - label: {text: "${title}", text_font: montserrat_24}
          - label: {id: "${prefix}_reason", y: 42, width: 100%, text: ""}
          - button:
              id: ${prefix}_cancel
              align: BOTTOM_LEFT
              width: 124
              height: 44
              styles: key_style
              on_click:
                - lvgl.widget.hide: ${prefix}_dialog
              widgets:
                - label: {align: CENTER, text: Cancel}
          - button:
              id: ${prefix}_recover
              align: BOTTOM_RIGHT
              width: 248
              height: 44
              styles: primary_style
              on_click:
                - script.execute: ${action}
              widgets:
                - label: {id: "${prefix}_recover_label", align: CENTER, text: "${caption}"}
