globals:
  - {id: display_brightness, type: int, restore_value: true, initial_value: '100'}
  - {id: display_timeout_index, type: int, restore_value: true, initial_value: '2'}

script:
  - id: wake_display
    then:
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
          else:
            - lambda: lv_display_trigger_activity(nullptr);
  - id: open_display
    then:
      - lvgl.slider.update:
          id: brightness_slider
          value: !lambda return id(display_brightness);
          animated: false
      - lvgl.label.update:
          id: brightness_label
          text: {format: "%d%%", args: [id(display_brightness)]}
      - lvgl.dropdown.update:
          id: timeout_select
          selected_index: !lambda return id(display_timeout_index);
      - lvgl.page.show: display_settings

lvgl:
  id: scale_ui
  resume_on_input: true
  on_idle:
    - timeout: !lambda |-
        constexpr uint32_t seconds[] = {30, 60, 120, 300, 600};
        return seconds[id(display_timeout_index)] * 1000;
      then:
        - script.execute: {id: set_backlight, level: 0}
        - lvgl.pause:
  on_resume:
    - script.execute:
        id: set_backlight
        level: !lambda return id(display_brightness);
  pages:
    - id: display_settings
      styles: page_style
      widgets:
        - label: {align: TOP_MID, y: 10, text_font: montserrat_24, text: Display}
        - button:
            <<: !include back-button.yaml
            id: display_back
            on_click:
              - script.execute: open_device_menu
        - obj:
            x: "${screen_inset}"
            y: 56
            width: "${screen_content_width}"
            height: 104
            scrollable: false
            styles: [panel_style, card_corners]
            widgets:
              - label: {x: 14, y: 10, text: Brightness}
              - label: {id: brightness_label, align: TOP_RIGHT, x: -14, y: 10, styles: accent_style, text: ""}
              - slider:
                  id: brightness_slider
                  x: 22
                  y: 58
                  width: 418
                  height: 12
                  min_value: 10
                  max_value: 100
                  styles: track_style
                  indicator: {styles: primary_style}
                  knob: {styles: primary_style, pad_all: 10}
                  on_value:
                    - globals.set: {id: display_brightness, value: !lambda return static_cast<int>(x);}
                    - lvgl.label.update:
                        id: brightness_label
                        text: {format: "%d%%", args: [id(display_brightness)]}
                    - script.execute:
                        id: set_backlight
                        level: !lambda return id(display_brightness);
        - label: {x: 20, y: 182, text: Turn screen off after}
        - dropdown:
            id: timeout_select
            x: "${screen_inset}"
            y: 215
            width: "${screen_content_width}"
            height: 48
            styles: key_style
            pad_left: 12
            dir: TOP
            options: ["30s", "1m", "2m", "5m", "10m"]
            dropdown_list: !include dropdown-list.yaml
            on_value:
              - globals.set: {id: display_timeout_index, value: !lambda return x;}
