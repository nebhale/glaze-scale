id: wifi_password_page
styles: page_style
on_load:
  - lvgl.keyboard.update: {id: wifi_keyboard, mode: TEXT_LOWER}
  - lvgl.label.update:
      id: wifi_password_prompt
      text: !lambda return "Password for " + id(chosen_ssid);
on_unload:
  - lvgl.textarea.update: {id: wifi_password, text: ""}
widgets:
  - label: {id: wifi_password_prompt, x: "${screen_inset}", y: 8, width: "${screen_content_width}", long_mode: DOT, styles: accent_style, text: ""}
  - textarea:
      id: wifi_password
      x: "${screen_inset}"
      y: 32
      width: "${screen_content_width}"
      height: 46
      pad_all: 8
      one_line: true
      max_length: 64
      styles: panel_style
  - button:
      <<: !include {file: editor-button.yaml, vars: {caption: Cancel, left: "${screen_inset}", width: 152, style: panel_style}}
      id: wifi_cancel
      on_click:
        - lvgl.page.show: networks_page
  - button:
      <<: !include {file: editor-button.yaml, vars: {caption: Connect, left: 168, width: 304, style: primary_style}}
      id: wifi_connect
      on_click: &connect
        - script.execute:
            id: submit_wifi
            password: !lambda return lv_textarea_get_text(id(wifi_password));
  - keyboard:
      id: wifi_keyboard
      align: BOTTOM_MID
      width: 480
      height: 184
      pad_all: "${screen_inset}"
      styles: page_style
      items: {styles: key_style}
      mode: TEXT_LOWER
      textarea: wifi_password
      on_ready: *connect
      on_cancel:
        - lvgl.page.show: networks_page
