globals:
  - id: chosen_ssid
    type: std::string
  - id: connected_ssid
    type: std::string
  - id: wifi_from_home
    type: bool
    initial_value: 'false'
  - id: wifi_connecting
    type: bool
    initial_value: 'false'
  - id: editing_wifi_password
    type: bool
    initial_value: 'false'

script:
  - id: open_device_menu
    then:
      - lambda: |-
          glaze::view.settings_open = true;
          lv_textarea_set_text(id(settings_value), "");
          glaze::label(id(calibration_status), glaze::view.needs_calibration ?
              "Calibration needed" : "Calibrate");
          if (!id(wifi_connecting))
            glaze::label(id(wifi_status), "Wi-Fi details");
          lv_obj_set_state(id(wifi_key), LV_STATE_DISABLED, id(wifi_connecting));
          lv_obj_set_state(id(calibrate_key), LV_STATE_DISABLED, glaze::station.state != glaze::State::Idle);
          if (glaze::station.state != glaze::State::Idle)
            glaze::label(id(calibration_status), "Remove jar to calibrate");
      - lvgl.page.show: device_menu
  - id: close_device_menu
    then:
      - lambda: |-
          lv_textarea_set_text(id(settings_value), "");
          glaze::view.settings_open = false;
      - lvgl.page.show: weigh_page
      - lambda: glaze::view.render(millis());
  - id: capture_empty
    then:
      - lambda: |-
          if (glaze::station.state != glaze::State::Idle) return;
          if (glaze::device_calibrator.empty(millis())) id(open_setting_field).execute(false);
          else glaze::label(id(calibrate_prompt), "Waiting for the load cell. Try again once it settles.");
  - id: open_calibration
    then:
      - lvgl.label.update: {id: calibrate_prompt, text: "Remove everything from the platform"}
      - lvgl.page.show: calibrate_page
  - id: open_system
    then:
      - script.execute: refresh_system_ip
      - lvgl.page.show: system_settings
  - id: open_networks
    then:
      - lambda: |-
          auto *from = lv_screen_active();
          if (from != id(settings_editor)->obj) id(wifi_from_home) = from == id(weigh_page)->obj;
          glaze::view.settings_open = true;
          id(chosen_ssid).clear();
          lv_textarea_set_text(id(settings_value), "");
          // Use the dropdown as a menu. Only a row being touched should highlight.
          lv_dropdown_set_selected_highlight(id(network_list)->obj, false);
          lv_dropdown_set_selected(id(network_list)->obj, 0);
          id(show_network_list).execute({});
      - lvgl.page.show: networks_page
      - script.execute: scan_wifi
  - id: show_network_list
    parameters:
      names: string[]
    then:
      - lambda: |-
          auto *picker = id(network_list)->obj;
          // Keep rows stable under the user's finger until the picker closes.
          if (lv_dropdown_is_open(picker)) return;

          const auto &connected = id(connected_ssid);
          if (!connected.empty() && connected.find_first_of("\r\n") == std::string::npos &&
              std::find(names.begin(), names.end(), connected) == names.end())
            names.push_back(connected);  // A connected hidden network can be absent from the scan.

          std::string options;
          for (const auto &name : names) {
            if (!options.empty()) options += '\n';
            options += name;
          }
          if (options != lv_dropdown_get_options(picker) || !lv_dropdown_get_text(picker)) {
            lv_dropdown_set_options(picker, options.c_str());
            lv_dropdown_set_text_static(picker, names.empty() ? "No networks available" : "Choose a network");
          }
          lv_obj_set_state(picker, LV_STATE_DISABLED, names.empty());
  - id: wifi_result
    parameters:
      success: bool
    then:
      - lambda: |-
          id(wifi_connecting) = false;
          lv_obj_set_state(id(wifi_key), LV_STATE_DISABLED, false);
          glaze::label(id(wifi_status), success ? "Wi-Fi connected" : "Failed. Check password.");
  - id: open_setting_field
    parameters:
      is_password_field: bool
    then:
      - lambda: |-
          id(editing_wifi_password) = is_password_field;
          glaze::visible(id(reference_title), !is_password_field);
          lv_obj_set_y(id(settings_prompt), is_password_field ? 8 : 50);
          lv_obj_set_width(id(settings_prompt), is_password_field ? ${screen_content_width} : 344);
          lv_obj_set_pos(id(settings_value), is_password_field ? ${screen_inset} : 360, is_password_field ? 32 : 37);
          lv_obj_set_width(id(settings_value), is_password_field ? ${screen_content_width} : 112);
          glaze::label(id(settings_prompt), is_password_field ? "Password for " + id(chosen_ssid) : "Weight in grams");
          glaze::label(id(settings_submit_label), is_password_field ? "Connect" : "Calibrate");
          lv_textarea_set_text(id(settings_value), "");
          lv_textarea_set_accepted_chars_static(id(settings_value), is_password_field ? nullptr : "0123456789");
          lv_textarea_set_max_length(id(settings_value), is_password_field ? 64 : 4);
          auto *keys = id(settings_keys)->obj;
          if (is_password_field) {
            lv_keyboard_set_mode(keys, LV_KEYBOARD_MODE_TEXT_LOWER);
          } else {
            static const char *const digits[] = {
                "1", "2", "3", "\n",
                "4", "5", "6", "\n",
                "7", "8", "9", "\n",
                "0", LV_SYMBOL_BACKSPACE, ""};
            constexpr auto single = LV_BUTTONMATRIX_CTRL_WIDTH_1;
            static const lv_buttonmatrix_ctrl_t widths[] = {
                single, single, single,
                single, single, single,
                single, single, single,
                LV_BUTTONMATRIX_CTRL_WIDTH_2, single};
            lv_keyboard_set_map(keys, LV_KEYBOARD_MODE_USER_1, digits, widths);
            lv_keyboard_set_mode(keys, LV_KEYBOARD_MODE_USER_1);
          }
      - lvgl.page.show: settings_editor
  - id: cancel_setting
    then:
      - lambda: |-
          if (id(editing_wifi_password)) id(open_networks).execute();
          else id(open_device_menu).execute();
  - id: accept_setting
    then:
      - lambda: |-
          if (lv_screen_active() != id(settings_editor)->obj) return;
          std::string value = lv_textarea_get_text(id(settings_value));
          if (id(editing_wifi_password)) {
            if (id(wifi_connecting)) return;
            if (value.size() > 64) {
              glaze::label(id(settings_prompt), "Enter a password of up to 64 bytes"); return;
            }
            id(wifi_connecting) = true;
            id(open_device_menu).execute();
            glaze::label(id(wifi_status), "Connecting...");
            id(connect_wifi).execute(id(chosen_ssid), value);
          } else {
            if (glaze::station.state != glaze::State::Idle) return;
            int grams = value.empty() || value.find_first_not_of("0123456789") != value.npos ? 0 : atoi(value.c_str());
            if (!glaze::device_calibrator.calibrate(id(platform_calibration), grams, millis())) {
              glaze::label(id(settings_prompt), "Use a steady weight, 1 to 2000 g");
              return;
            }
            glaze::view.needs_calibration = false;
            glaze::station.reading.reset();
            id(open_device_menu).execute();
            glaze::label(id(calibration_status), "Calibrated");
          }

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return lv_screen_active() == id(networks_page)->obj;
          then:
            - script.execute: refresh_networks
      - if:
          condition:
            lvgl.page.is_showing: system_settings
          then:
            - script.execute: refresh_system_ip
  - interval: 100ms
    then:
      - lambda: |-
          if (!glaze::view.settings_open) return;
          auto *page = lv_screen_active();
          bool jar_on_scale = glaze::station.state != glaze::State::Idle;
          if (page == id(device_menu)->obj) {
            if (jar_on_scale != lv_obj_has_state(id(calibrate_key), LV_STATE_DISABLED)) {
              lv_obj_set_state(id(calibrate_key), LV_STATE_DISABLED, jar_on_scale);
              glaze::label(id(calibration_status), jar_on_scale ? "Remove jar to calibrate" :
                  glaze::view.needs_calibration ? "Calibration needed" : "Calibrate");
            }
          } else if (jar_on_scale) {
            if (page == id(calibrate_page)->obj || (page == id(settings_editor)->obj && !id(editing_wifi_password)))
              id(open_device_menu).execute();
          }

lvgl:
  pages:
    - id: device_menu
      styles: page_style
      widgets:
        - label: {align: TOP_MID, y: 12, styles: accent_style, text_font: montserrat_18, text: Settings}
        - button:
            id: settings_back
            align: TOP_RIGHT
            x: "-${screen_inset}"
            y: "${screen_inset}"
            width: 44
            height: 44
            bg_color: 0x622635
            border_width: 0
            shadow_width: 0
            on_click:
              - script.execute: close_device_menu
            widgets:
              - label: {align: CENTER, text_color: 0xFF7779, text_font: montserrat_18, text: "\uF00D"}
        - !include
          file: settings-tile.yaml
          vars: {tile: wifi_key, title: Connection, subtitle: "Wi-Fi details", subtitle_id: wifi_status, icon: "\uF1EB", left: "${screen_inset}", top: 60, open: open_networks}
        - !include
          file: settings-tile.yaml
          vars: {tile: calibrate_key, title: Scale, subtitle: "Calibrate", subtitle_id: calibration_status, icon: "\uF01C", left: 244, top: 60, open: open_calibration}
        - !include
          file: settings-tile.yaml
          vars: {tile: display_key, title: Display, subtitle: "Brightness & timeout", subtitle_id: display_hint, icon: "\uF03E", left: "${screen_inset}", top: 190, open: open_display}
        - !include
          file: settings-tile.yaml
          vars: {tile: system_key, title: System, subtitle: "Build information", subtitle_id: system_hint, icon: "\uF013", left: 244, top: 190, open: open_system}
    - id: networks_page
      styles: page_style
      widgets:
        - label: {align: TOP_MID, y: 10, text_font: montserrat_24, text: Wi-Fi network}
        - button:
            <<: !include back-button.yaml
            id: networks_back
            on_click:
              - if:
                  condition:
                    lambda: return id(wifi_from_home);
                  then:
                    - script.execute: close_device_menu
                  else:
                    - script.execute: open_device_menu
        - dropdown:
            id: network_list
            x: "${screen_inset}"
            y: 64
            width: "${screen_content_width}"
            height: 48
            styles: key_style
            options: [Scanning...]
            dropdown_list: !include dropdown-list.yaml
            on_value:
              - lambda: |-
                  auto *picker = id(network_list)->obj;
                  if (lv_screen_active() != id(networks_page)->obj || lv_obj_has_state(picker, LV_STATE_DISABLED)) return;
                  char ssid[33]{};
                  lv_dropdown_get_selected_str(picker, ssid, sizeof(ssid));
                  if (!*ssid) return;
                  id(chosen_ssid) = ssid;
                  id(open_setting_field).execute(true);
        - button:
            id: scan_now
            x: "${screen_inset}"
            y: 124
            width: "${screen_content_width}"
            height: 48
            styles: panel_style
            on_click:
              - script.execute: scan_wifi
            widgets:
              - label: {align: CENTER, text: Scan now}
    - id: settings_editor
      styles: page_style
      widgets:
        - label: {id: reference_title, x: "${screen_inset}", y: 8, text_font: montserrat_24, hidden: true, text: Reference Item}
        - label: {id: settings_prompt, x: "${screen_inset}", y: 8, width: "${screen_content_width}", long_mode: DOT, styles: accent_style, text: ""}
        - textarea: {id: settings_value, x: "${screen_inset}", y: 32, width: "${screen_content_width}", height: 46, pad_all: 8, one_line: true, styles: panel_style}
        - button:
            id: settings_cancel
            x: "${screen_inset}"
            y: 88
            width: 152
            height: 44
            styles: panel_style
            on_click:
              - script.execute: cancel_setting
            widgets:
              - label: {align: CENTER, text: Cancel}
        - button:
            id: settings_continue
            x: 168
            y: 88
            width: 304
            height: 44
            styles: primary_style
            on_click:
              - script.execute: accept_setting
            widgets:
              - label: {id: settings_submit_label, align: CENTER, text: ""}
        - keyboard:
            id: settings_keys
            align: BOTTOM_MID
            width: 480
            height: 184
            styles: page_style
            pad_all: "${screen_inset}"
            textarea: settings_value
            items: {styles: key_style}
            on_ready:
              - script.execute: accept_setting
            on_cancel:
              - script.execute: cancel_setting
    - !include
      file: platform-prompt.yaml
      vars:
        prompt_id: calibrate_prompt
        page: calibrate_page
        title: Calibrate
        action: capture_empty
        caption: Empty
        cancel_action: open_device_menu

    - id: system_settings
      styles: page_style
      widgets:
        - label: {align: TOP_MID, y: 10, text_font: montserrat_24, text: System}
        - button:
            <<: !include back-button.yaml
            id: system_back
            on_click:
              - script.execute: open_device_menu
        - obj:
            x: "${screen_inset}"
            y: 56
            width: "${screen_content_width}"
            height: 196
            styles: [panel_style, card_corners]
            scrollable: false
            widgets:
              - label: {x: 14, y: 20, styles: muted_style, text: "IP address"}
              - label: {id: system_ip, x: 148, y: 20, text: ""}
              - label: {x: 14, y: 79, styles: muted_style, text: "Glaze Scale"}
              - label:
                  id: system_version
                  x: 148
                  y: 79
                  width: 296
                  long_mode: SCROLL_CIRCULAR
                  text: !lambda return std::string(GLAZE_SCALE_VERSION);
              - label: {x: 14, y: 138, styles: muted_style, text: "ESPHome"}
              - label:
                  id: system_esphome
                  x: 148
                  y: 138
                  text: !lambda return std::string(ESPHOME_VERSION);
