globals:
  - id: chosen_ssid
    type: std::string
  - id: connected_ssid
    type: std::string
  - id: wifi_from_home
    type: bool
    initial_value: 'false'
  - id: wifi_connecting
    type: bool
    initial_value: 'false'

script:
  - id: open_device_menu
    then:
      - lambda: |-
          glaze::view.settings_open = true;
          glaze::label(id(calibration_status), glaze::view.needs_calibration ?
              "Calibration needed" : "Calibrate");
          if (!id(wifi_connecting))
            glaze::label(id(wifi_status), "Wi-Fi details");
          lv_obj_set_state(id(wifi_key), LV_STATE_DISABLED, id(wifi_connecting));
          lv_obj_set_state(id(calibrate_key), LV_STATE_DISABLED, glaze::station.state != glaze::State::Idle);
          if (glaze::station.state != glaze::State::Idle)
            glaze::label(id(calibration_status), "Remove jar to calibrate");
      - lvgl.page.show: device_menu
  - id: close_device_menu
    then:
      - lambda: |-
          glaze::view.settings_open = false;
      - lvgl.page.show: weigh_page
      - lambda: glaze::view.render(millis());
  - id: capture_empty
    then:
      - if:
          condition:
            lambda: return glaze::station.state == glaze::State::Idle;
          then:
            - if:
                condition:
                  lambda: return glaze::device_calibrator.empty(millis());
                then:
                  - lvgl.page.show: reference_weight_page
                else:
                  - lvgl.label.update: {id: calibrate_prompt, text: "Waiting for the load cell. Try again once it settles."}
  - id: open_calibration
    then:
      - lvgl.label.update: {id: calibrate_prompt, text: "Remove everything from the platform"}
      - lvgl.page.show: calibrate_page
  - id: open_system
    then:
      - script.execute: refresh_system_ip
      - lvgl.page.show: system_settings
  - id: open_networks
    then:
      - lambda: |-
          id(wifi_from_home) = lv_screen_active() == id(weigh_page)->obj;
          glaze::view.settings_open = true;
      - lvgl.page.show: networks_page
      - script.execute: scan_wifi
  - id: show_network_list
    parameters:
      names: string[]
    then:
      - lambda: |-
          auto *picker = id(network_list)->obj;
          // Keep rows stable under the user's finger until the picker closes.
          if (lv_dropdown_is_open(picker)) return;

          const auto &connected = id(connected_ssid);
          bool has_current = !connected.empty() && connected.find_first_of("\r\n") == std::string::npos;
          auto current = std::find(names.begin(), names.end(), connected);
          size_t selected = has_current ? current - names.begin() : 0;
          if (has_current && current == names.end()) names.push_back(connected);  // Hidden or absent from this scan.

          std::string options;
          for (const auto &name : names) {
            if (!options.empty()) options += '\n';
            options += name;
          }
          if (options != lv_dropdown_get_options(picker)) lv_dropdown_set_options(picker, options.c_str());
          lv_dropdown_set_selected(picker, selected);
          // A null override lets LVGL display the selected option itself.
          const char *prompt = has_current ? nullptr : (names.empty() ? "No networks available" : "Choose a network");
          if (lv_dropdown_get_text(picker) != prompt) lv_dropdown_set_text_static(picker, prompt);
          if (lv_dropdown_get_selected_highlight(picker) != has_current)
            lv_dropdown_set_selected_highlight(picker, has_current);
          lv_obj_set_state(picker, LV_STATE_DISABLED, names.empty());
  - id: wifi_result
    parameters:
      success: bool
    then:
      - globals.set: {id: wifi_connecting, value: 'false'}
      - lvgl.widget.enable: wifi_key
      - lvgl.label.update:
          id: wifi_status
          text: !lambda |-
            return std::string(success ? "Wi-Fi connected" : "Failed. Check password.");
  - id: submit_wifi
    parameters:
      password: string
    then:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: wifi_password_page
              - lambda: return !id(wifi_connecting);
          then:
            - if:
                condition:
                  lambda: return password.size() <= 64;
                then:
                  - globals.set: {id: wifi_connecting, value: 'true'}
                  - script.execute: open_device_menu
                  - lvgl.label.update: {id: wifi_status, text: "Connecting..."}
                  - script.execute:
                      id: connect_wifi
                      ssid_value: !lambda return id(chosen_ssid);
                      password_value: !lambda return password;
                else:
                  - lvgl.label.update: {id: wifi_password_prompt, text: "Enter a password of up to 64 bytes"}
  - id: submit_calibration
    then:
      - if:
          condition:
            and:
              - lvgl.page.is_showing: reference_weight_page
              - lambda: return glaze::station.state == glaze::State::Idle;
          then:
            - if:
                condition:
                  lambda: |-
                    int grams = atoi(lv_textarea_get_text(id(reference_grams)));
                    return glaze::device_calibrator.calibrate(id(platform_calibration), grams, millis());
                then:
                  - lambda: |-
                      glaze::view.needs_calibration = false;
                      glaze::station.reading.reset();
                  - script.execute: open_device_menu
                  - lvgl.label.update: {id: calibration_status, text: Calibrated}
                else:
                  - lvgl.label.update: {id: reference_prompt, text: "Use a steady weight, 1 to 2000 g"}

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lvgl.page.is_showing: networks_page
          then:
            - script.execute: refresh_networks
      - if:
          condition:
            lvgl.page.is_showing: system_settings
          then:
            - script.execute: refresh_system_ip
  - interval: 100ms
    then:
      - lambda: |-
          if (!glaze::view.settings_open) return;
          auto *page = lv_screen_active();
          bool jar_on_scale = glaze::station.state != glaze::State::Idle;
          if (page == id(device_menu)->obj) {
            if (jar_on_scale != lv_obj_has_state(id(calibrate_key), LV_STATE_DISABLED)) {
              lv_obj_set_state(id(calibrate_key), LV_STATE_DISABLED, jar_on_scale);
              glaze::label(id(calibration_status), jar_on_scale ? "Remove jar to calibrate" :
                  glaze::view.needs_calibration ? "Calibration needed" : "Calibrate");
            }
          } else if (jar_on_scale) {
            if (page == id(calibrate_page)->obj || page == id(reference_weight_page)->obj)
              id(open_device_menu).execute();
          }

lvgl:
  pages:
    - id: device_menu
      styles: page_style
      widgets:
        - label: {align: TOP_MID, y: 12, styles: accent_style, text_font: montserrat_18, text: Settings}
        - button:
            id: settings_back
            align: TOP_RIGHT
            x: "-${screen_inset}"
            y: "${screen_inset}"
            width: 44
            height: 44
            bg_color: 0x622635
            border_width: 0
            shadow_width: 0
            on_click:
              - script.execute: close_device_menu
            widgets:
              - label: {align: CENTER, text_color: 0xFF7779, text_font: montserrat_18, text: "\uF00D"}
        - !include
          file: settings-tile.yaml
          vars: {tile: wifi_key, title: Connection, subtitle: "Wi-Fi details", subtitle_id: wifi_status, icon: "\uF1EB", left: "${screen_inset}", top: 60, open: open_networks}
        - !include
          file: settings-tile.yaml
          vars: {tile: calibrate_key, title: Scale, subtitle: "Calibrate", subtitle_id: calibration_status, icon: "\uF01C", left: 244, top: 60, open: open_calibration}
        - !include
          file: settings-tile.yaml
          vars: {tile: display_key, title: Display, subtitle: "Brightness & timeout", subtitle_id: display_hint, icon: "\uF03E", left: "${screen_inset}", top: 190, open: open_display}
        - !include
          file: settings-tile.yaml
          vars: {tile: system_key, title: System, subtitle: "Build information", subtitle_id: system_hint, icon: "\uF013", left: 244, top: 190, open: open_system}
    - id: networks_page
      styles: page_style
      on_load:
        - lambda: id(chosen_ssid).clear();
        - script.execute: refresh_networks
      widgets:
        - label: {align: TOP_MID, y: 10, text_font: montserrat_24, text: Wi-Fi network}
        - button:
            <<: !include back-button.yaml
            id: networks_back
            on_click:
              - if:
                  condition:
                    lambda: return id(wifi_from_home);
                  then:
                    - script.execute: close_device_menu
                  else:
                    - script.execute: open_device_menu
        - dropdown:
            id: network_list
            x: "${screen_inset}"
            y: 64
            width: "${screen_content_width}"
            height: 48
            styles: key_style
            options: [Scanning...]
            dropdown_list: !include dropdown-list.yaml
            on_value:
              - if:
                  condition:
                    and:
                      - lvgl.page.is_showing: networks_page
                      - lambda: |-
                          auto *picker = id(network_list)->obj;
                          if (lv_obj_has_state(picker, LV_STATE_DISABLED)) return false;
                          char ssid[33]{};
                          lv_dropdown_get_selected_str(picker, ssid, sizeof(ssid));
                          id(chosen_ssid) = ssid;
                          return !id(chosen_ssid).empty();
                  then:
                    - lvgl.page.show: wifi_password_page
        - button:
            id: scan_now
            x: "${screen_inset}"
            y: 124
            width: "${screen_content_width}"
            height: 48
            styles: panel_style
            on_click:
              - script.execute: scan_wifi
            widgets:
              - label: {align: CENTER, text: Scan now}
    - !include wifi-password.yaml
    - !include reference-weight.yaml
    - !include
      file: platform-prompt.yaml
      vars:
        prompt_id: calibrate_prompt
        page: calibrate_page
        title: Calibrate
        action: capture_empty
        caption: Empty
        cancel_action: open_device_menu

    - id: system_settings
      styles: page_style
      widgets:
        - label: {align: TOP_MID, y: 10, text_font: montserrat_24, text: System}
        - button:
            <<: !include back-button.yaml
            id: system_back
            on_click:
              - script.execute: open_device_menu
        - obj:
            x: "${screen_inset}"
            y: 56
            width: "${screen_content_width}"
            height: 196
            styles: [panel_style, card_corners]
            scrollable: false
            widgets:
              - label: {x: 14, y: 20, styles: muted_style, text: "IP address"}
              - label: {id: system_ip, x: 148, y: 20, text: ""}
              - label: {x: 14, y: 79, styles: muted_style, text: "Glaze Scale"}
              - label:
                  id: system_version
                  x: 148
                  y: 79
                  width: 296
                  long_mode: SCROLL_CIRCULAR
                  text: !lambda return std::string(GLAZE_SCALE_VERSION);
              - label: {x: 14, y: 138, styles: muted_style, text: "ESPHome"}
              - label:
                  id: system_esphome
                  x: 148
                  y: 138
                  text: !lambda return std::string(ESPHOME_VERSION);
