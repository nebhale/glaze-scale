name: Set up ESPHome
description: Install the project's pinned ESPHome CLI in an isolated environment
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "0.13.6"
        python-version: "3.13"
        enable-cache: false
    - shell: bash
      run: |
        uv venv --python 3.13 "$RUNNER_TEMP/esphome"
        uv pip install --python "$RUNNER_TEMP/esphome/bin/python" -r requirements.txt
        echo "$RUNNER_TEMP/esphome/bin" >> "$GITHUB_PATH"
