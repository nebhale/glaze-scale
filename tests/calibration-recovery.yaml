# Exit in the button callback's first tick so neither periodic sync nor an
# orderly shutdown can make an asynchronous save pass this test.
- if:
    condition:
      lambda: return std::string(getenv("GLAZE_TEST_CALIBRATION")) == "calibrate";
    then:
      - lambda: |-
          if (glaze::platform_calibration.zero != 10 || glaze::platform_calibration.counts_per_gram != 1) exit(160);
          id(simulated_load) = 20;
      - delay: 1800ms
      - lambda: |-
          lv_obj_send_event(id(home_settings), LV_EVENT_CLICKED, nullptr);
          lv_obj_send_event(id(calibrate_key), LV_EVENT_CLICKED, nullptr);
          lv_obj_send_event(id(capture_empty_key), LV_EVENT_CLICKED, nullptr);
          id(simulated_load) = 220;
      - delay: 1200ms
      - lambda: |-
          lv_textarea_set_text(id(settings_value), "100");
          std::string dir = getenv("ESPHOME_PREFDIR");
          setenv("ESPHOME_PREFDIR", "/dev/null", 1);
          lv_obj_send_event(id(settings_continue), LV_EVENT_CLICKED, nullptr);
          setenv("ESPHOME_PREFDIR", dir.c_str(), 1);
          if (lv_screen_active() != id(settings_editor)->obj || strcmp(lv_label_get_text(id(settings_prompt)), "Could not save. Retry.") ||
              glaze::platform_calibration.zero != 10 || glaze::platform_calibration.counts_per_gram != 1) exit(161);
          lv_obj_send_event(id(settings_continue), LV_EVENT_CLICKED, nullptr);
          if (lv_screen_active() != id(device_menu)->obj || strcmp(lv_label_get_text(id(calibration_status)), "Calibration saved")) exit(162);
          std::_Exit(0);
- if:
    condition:
      lambda: return std::string(getenv("GLAZE_TEST_CALIBRATION")) == "tare";
    then:
      - lambda: |-
          if (glaze::platform_calibration.zero != 20 || glaze::platform_calibration.counts_per_gram != 2) exit(163);
          id(simulated_load) = 320;
      - delay: 1800ms
      - lambda: |-
          if (strcmp(lv_label_get_text(id(amount)), "150 g")) exit(164);
          std::string dir = getenv("ESPHOME_PREFDIR");
          setenv("ESPHOME_PREFDIR", "/dev/null", 1);
          lv_obj_send_event(id(home_tare), LV_EVENT_CLICKED, nullptr);
          setenv("ESPHOME_PREFDIR", dir.c_str(), 1);
          if (glaze::platform_calibration.zero != 20 || strcmp(lv_label_get_text(id(amount)), "150 g") ||
              !strstr(lv_label_get_text(id(condition_label)), "Could not save tare")) exit(165);
          lv_obj_send_event(id(home_tare), LV_EVENT_CLICKED, nullptr);
          std::_Exit(0);
- lambda: |-
    if (glaze::platform_calibration.zero != 320 || glaze::platform_calibration.counts_per_gram != 2) exit(166);
    id(simulated_load) = 520;
- delay: 1800ms
- lambda: |-
    std::_Exit(strcmp(lv_label_get_text(id(amount)), "100 g") ? 167 : 0);
