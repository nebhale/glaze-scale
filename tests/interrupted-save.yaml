# Keep retrying the original jar until shutdown. The next boot uses the same
# preferences directory and must start idle without resubmitting the request.
- if:
    condition:
      lambda: return std::string(getenv("GLAZE_TEST_INTERRUPTION")) == "start";
    then:
      - lambda: |-
          glaze::station.device = "glaze-recovery-test";
          const bool setup = getenv("GLAZE_TEST_CREATE") != nullptr;
          if (!getenv("GLAZE_TEST_UNTAGGED"))
            glaze::station.tag(setup ? "B1B2B3B4" : "A1A2A3A4", millis());
          id(simulated_load) = setup ? 600 : 475;
      - delay: 1300ms
      - if:
          condition:
            lambda: return getenv("GLAZE_TEST_CREATE") != nullptr;
          then:
            - lambda: |-
                glaze::station.begin_setup();
                glaze::station.selected_draft.name = "Mist Blue";
                glaze::station.selected_draft.code = "MB-12";
                glaze::station.glaze = {"", "Mist Blue", "MB-12"};
                glaze::station.location = "Kiln room";
                glaze::station.cost = "15.50";
            - delay: 200ms
            - lambda: lv_obj_send_event(id(new_jar_create), LV_EVENT_CLICKED, nullptr);
          else:
            - lambda: lv_obj_send_event(id(home_save), LV_EVENT_CLICKED, nullptr);
      - delay: 450ms
      - lambda: |-
          if (glaze::station.state != glaze::State::Pending || lv_obj_has_flag(id(service_warning), LV_OBJ_FLAG_HIDDEN)) exit(140);
          glaze::station.removed(millis());
          id(simulated_load) = 0;
      - delay: 2100ms
      - lambda: |-
          if (glaze::station.state != glaze::State::Pending || glaze::station.present || glaze::station.selected() ||
              !glaze::station.reading.stable(millis()) || !lv_obj_has_state(id(home_save), LV_STATE_DISABLED)) exit(141);
          if (getenv("ESPHOME_SNAPSHOT_DIR"))
            id(panel).take_snapshot(getenv("GLAZE_TEST_CREATE") ? "create-lifted" : "save-lifted");
          glaze::station.tag("CCDD", millis());
          id(simulated_load) = 820;
      - delay: 1s
      - lambda: |-
          glaze::station.select_jar("2");
          glaze::station.begin_setup();
          glaze::station.confirm(millis());
          if (glaze::station.state != glaze::State::Pending || glaze::station.screen != glaze::Screen::Home ||
              !lv_obj_has_state(id(home_save), LV_STATE_DISABLED)) exit(142);
          if (getenv("GLAZE_TEST_GRACEFUL")) App.safe_reboot();
          else std::_Exit(0);
- delay: 1600ms
- lambda: |-
    if (glaze::station.pending_save().active() || glaze::station.state != glaze::State::Idle ||
        glaze::station.selected() || !glaze::station.notice.empty() ||
        !lv_obj_has_state(id(home_save), LV_STATE_DISABLED)) exit(143);
    if (getenv("ESPHOME_SNAPSHOT_DIR"))
      id(panel).take_snapshot(getenv("GLAZE_TEST_CREATE") ? "create-restarted" : "save-restarted");
    exit(0);
