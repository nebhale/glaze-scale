# Exercise both sides of the standard preference flush with abrupt exits.
- if:
    condition:
      lambda: return std::string(getenv("GLAZE_TEST_CALIBRATION")) == "calibrate";
    then:
      - lambda: id(simulated_load) = 20;
      - delay: 1800ms
      - lambda: |-
          lv_obj_send_event(id(home_settings), LV_EVENT_CLICKED, nullptr);
          lv_obj_send_event(id(calibrate_key), LV_EVENT_CLICKED, nullptr);
          lv_obj_send_event(id(capture_empty_key), LV_EVENT_CLICKED, nullptr);
          id(simulated_load) = 220;
      - delay: 1200ms
      - lambda: |-
          lv_textarea_set_text(id(settings_value), "100");
          lv_obj_send_event(id(settings_continue), LV_EVENT_CLICKED, nullptr);
          if (lv_screen_active() != id(device_menu)->obj || id(platform_calibration) != glaze::Calibration{20, 2}) exit(161);
      - delay: 65s
      - lambda: std::_Exit(0);
- lambda: |-
    if (id(platform_calibration) != glaze::Calibration{20, 2}) exit(163);
    if (std::string(getenv("GLAZE_TEST_CALIBRATION")) == "verify") exit(0);
    id(simulated_load) = 320;
- delay: 1800ms
- lambda: |-
    if (strcmp(lv_label_get_text(id(amount)), "150 g")) exit(164);
    lv_obj_send_event(id(home_tare), LV_EVENT_CLICKED, nullptr);
    if (id(platform_calibration) != glaze::Calibration{320, 2}) exit(165);
    std::_Exit(0);  // The new zero is live but has not reached the next flush.
