# Start from the tared platform left by the tagged setup test.
- lambda: |-
    glaze::station.device = "glaze-manual-setup-test";
    glaze::station.removed(millis());
- delay: 1s
- lambda: lv_dropdown_open(id(jar_picker)->obj);
- delay: 650ms
- lambda: |-
    auto *picker = id(jar_picker)->obj;
    lv_dropdown_set_selected(picker, lv_dropdown_get_option_count(picker) - 1);
    char last[32];
    lv_dropdown_get_selected_str(picker, last, sizeof(last));
    if (strcmp(last, "Create jar...")) exit(150);
    lv_dropdown_close(picker);
    lv_obj_send_event(picker, LV_EVENT_VALUE_CHANGED, nullptr);
- delay: 200ms
- lambda: |-
    if (glaze::station.screen != glaze::Screen::Setup || glaze::station.present) exit(151);
    if (strcmp(lv_label_get_text(id(jar_glaze_text)), "Glaze")) exit(151);
    lv_obj_send_event(id(jar_glaze), LV_EVENT_CLICKED, nullptr);
- delay: 400ms
- lambda: lv_obj_send_event(lv_obj_get_child(id(menu_body), -1), LV_EVENT_CLICKED, nullptr);
- delay: 200ms
- lambda: |-
    if (lv_screen_active() != id(new_glaze_page)->obj || !lv_obj_has_state(id(new_glaze_create), LV_STATE_DISABLED)) exit(156);
    lv_obj_send_event(id(glaze_maker), LV_EVENT_CLICKED, nullptr);
- delay: 400ms
- lambda: lv_obj_send_event(lv_obj_get_child(id(menu_body), -1), LV_EVENT_CLICKED, nullptr);
- delay: 200ms
- lambda: |-
    if (lv_screen_active() != id(new_manufacturer_page)->obj) exit(157);
    lv_obj_send_event(id(manufacturer_name), LV_EVENT_CLICKED, nullptr);
- delay: 200ms
- lambda: |-
    lv_textarea_set_text(id(edit_value), "Studio");
    lv_obj_send_event(id(input_keys)->obj, LV_EVENT_READY, nullptr);
- delay: 200ms
- lambda: |-
    if (strcmp(lv_label_get_text(id(manufacturer_name_text)), "Studio") ||
        lv_obj_has_state(id(new_manufacturer_create), LV_STATE_DISABLED)) exit(157);
    lv_obj_send_event(id(new_manufacturer_create), LV_EVENT_CLICKED, nullptr);
- delay: 400ms
- lambda: |-
    if (lv_screen_active() != id(new_glaze_page)->obj || strcmp(lv_label_get_text(id(glaze_maker_text)), "Studio")) exit(158);
    lv_obj_send_event(id(glaze_name), LV_EVENT_CLICKED, nullptr);
- delay: 200ms
- lambda: |-
    lv_textarea_set_text(id(edit_value), "Mist Blue");
    lv_obj_send_event(id(input_keys)->obj, LV_EVENT_READY, nullptr);
- delay: 200ms
- lambda: |-
    if (strcmp(lv_label_get_text(id(glaze_name_text)), "Mist Blue") || lv_obj_has_state(id(new_glaze_create), LV_STATE_DISABLED)) exit(158);
    lv_obj_send_event(id(new_glaze_create), LV_EVENT_CLICKED, nullptr);
- delay: 200ms
- lambda: |-
    if (lv_screen_active() != id(new_jar_page)->obj || strcmp(lv_label_get_text(id(jar_glaze_text)), "Mist Blue")) exit(159);
    lv_obj_send_event(id(jar_cost), LV_EVENT_CLICKED, nullptr);
- delay: 200ms
- lambda: |-
    if (lv_screen_active() != id(cost_page)->obj) exit(160);
    lv_textarea_set_text(id(cost_value), "12.345");
- script.execute: {id: tap_screen, x: 415, y: 250}  # Confirm
- script.wait: tap_screen
- lambda: |-
    if (lv_screen_active() != id(cost_page)->obj || !*lv_label_get_text(id(cost_notice))) exit(160);
- script.execute: {id: tap_screen, x: 415, y: 162}  # Backspace
- script.wait: tap_screen
- script.execute: {id: tap_screen, x: 415, y: 250}
- script.wait: tap_screen
- lambda: |-
    if (lv_screen_active() != id(new_jar_page)->obj || strcmp(lv_label_get_text(id(jar_cost_text)), "$12.34")) exit(160);
    lv_obj_send_event(id(jar_cost), LV_EVENT_CLICKED, nullptr);
- delay: 200ms
- lambda: |-
    if (strcmp(lv_textarea_get_text(id(cost_value)), "12.34") || *lv_label_get_text(id(cost_notice))) exit(160);
    lv_textarea_set_text(id(cost_value), "9");
- script.execute: {id: tap_screen, x: 350, y: 292}  # Decimal point
- script.wait: tap_screen
- lambda: |-
    if (strcmp(lv_textarea_get_text(id(cost_value)), "9.")) exit(160);
- script.execute: {id: tap_screen, x: 415, y: 204}  # Cancel
- script.wait: tap_screen
- lambda: |-
    if (glaze::station.cost != "12.34") exit(160);
    lv_obj_send_event(id(jar_container), LV_EVENT_CLICKED, nullptr);
- delay: 400ms
- lambda: lv_obj_send_event(lv_obj_get_child(id(menu_body), -1), LV_EVENT_CLICKED, nullptr);
- delay: 200ms
- lambda: |-
    if (lv_screen_active() != id(new_container_page)->obj || !lv_obj_has_state(id(new_container_create), LV_STATE_DISABLED)) exit(159);
    lv_obj_send_event(id(container_name), LV_EVENT_CLICKED, nullptr);
- delay: 200ms
- lambda: |-
    lv_textarea_set_text(id(edit_value), "Pint jar");
    lv_obj_send_event(id(input_keys)->obj, LV_EVENT_READY, nullptr);
- delay: 200ms
- lambda: |-
    if (strcmp(lv_label_get_text(id(container_name_text)), "Pint jar") || lv_obj_has_state(id(new_container_create), LV_STATE_DISABLED)) exit(159);
    lv_obj_send_event(id(container_weight), LV_EVENT_CLICKED, nullptr);
- delay: 200ms
- lambda: |-
    if (lv_screen_active() != id(weight_page)->obj || lv_buttonmatrix_get_button_text(id(weight_keys)->obj, 13) != nullptr) exit(161);
    lv_textarea_set_text(id(weight_value), "10000001");
- script.execute: {id: tap_screen, x: 415, y: 250}
- script.wait: tap_screen
- lambda: |-
    if (lv_screen_active() != id(weight_page)->obj || !*lv_label_get_text(id(weight_notice))) exit(161);
    lv_textarea_set_text(id(weight_value), "");
    lv_textarea_add_text(id(weight_value), ".");
- script.execute: {id: tap_screen, x: 230, y: 292}  # Zero, the full-width bottom key
- script.wait: tap_screen
- lambda: |-
    if (strcmp(lv_textarea_get_text(id(weight_value)), "0")) exit(161);
- script.execute: {id: tap_screen, x: 415, y: 250}
- script.wait: tap_screen
- lambda: |-
    if (lv_screen_active() != id(new_container_page)->obj || strcmp(lv_label_get_text(id(container_weight_text)), "0 g")) exit(161);
    lv_obj_send_event(id(new_container_create), LV_EVENT_CLICKED, nullptr);
- delay: 400ms
- lambda: |-
    if (lv_screen_active() != id(new_jar_page)->obj || strcmp(lv_label_get_text(id(jar_container_text)), "Pint jar") ||
        !lv_obj_has_state(id(new_jar_create), LV_STATE_DISABLED)) exit(152);
    id(simulated_load) = 1125;
- delay: 1s
- lambda: |-
    if (lv_obj_has_state(id(new_jar_create), LV_STATE_DISABLED)) exit(153);
    lv_obj_send_event(id(new_jar_create), LV_EVENT_CLICKED, nullptr);
- delay: 500ms
- lambda: |-
    if (glaze::station.state != glaze::State::Saved || !glaze::station.selected() ||
        !glaze::station.manual || glaze::station.saved_gross != 525 ||
        strcmp(lv_label_get_text(id(weight_basis)), "of 525 g remaining") ||
        lv_bar_get_value(id(fill_level)) != 100) exit(154);
    id(simulated_load) = 600;
- delay: 1s
- lambda: |-
    if (glaze::station.selected() || glaze::station.state != glaze::State::Idle) exit(155);
